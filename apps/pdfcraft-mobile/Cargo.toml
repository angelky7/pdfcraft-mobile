[package]
name = "pdfcraft-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "PdfCraft on phones and tablets: the engine as a native library with Kotlin bindings (UniFFI); the app itself is in android/"

[lib]
name = "pdfcraft_mobile"
# cdylib: the library the Android app loads. lib: this crate's own tests.
crate-type = ["cdylib", "lib"]

[dependencies]
pdfcraft-engine = { workspace = true }
pdfcraft-render = { workspace = true }
# The annotation types an edit carries (Shape::Ink, Style, NewAnnotation): the engine takes them
# as arguments but re-exports only some, and naming the crate keeps the call unambiguous.
pdfcraft-annot = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# MPL-2.0, pure Rust. Pinned exactly: the Kotlin bindings are generated by the same release
# (bindgen/ shares this lock file) and refuse to load against another one.
uniffi = "0.32.2"

# The engine's log in logcat (pure Rust; links the system's liblog).
[target.'cfg(target_os = "android")'.dependencies]
android_logger = { version = "0.15", default-features = false }
