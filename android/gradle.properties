// Build settings that do not depend on the module. The Rust workspace the app's native library
// comes from is one level up from android/: <repo>/android → <repo>.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The app's version, in the two forms Android wants. The release workflow reads these so a tag
# and the built APK cannot disagree.
pdfcraft.version=0.1.0
pdfcraft.versionCode=1

# Which ABIs to build, comma separated: arm64-v8a (armv8, every phone and tablet since ~2016),
# armeabi-v7a (older 32-bit devices), x86_64 (emulators). The release build passes its own list.
pdfcraft.abis=arm64-v8a
